{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding-top: 3rem;">
    <div style="max-width: 800px; margin: 0 auto;">
        <div class="card fade-in">
            <h2 style="text-align: center; margin-bottom: 2rem;">Admin Settings</h2>
            
            <div class="settings-content">
                <h3>Platform Configuration</h3>
                
                <div class="settings-section">
                    <h4>General Settings</h4>
                    <div class="setting-item">
                        <label>Platform Name</label>
                        <input type="text" class="form-control" value="BUILD UP PILOT">
                    </div>
                    
                    <div class="setting-item">
                        <label>Contact Email</label>
                        <input type="email" class="form-control" value="admin@builduppilot.com">
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4>Feature Toggles</h4>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked> Enable Job Applications
                        </label>
                    </div>
                    
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked> Enable Skill Tests
                        </label>
                    </div>
                    
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked> Enable Mock Interviews
                        </label>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4>Security Settings</h4>
                    <div class="setting-item">
                        <label>Session Timeout (minutes)</label>
                        <input type="number" class="form-control" value="30">
                    </div>
                    
                    <div class="setting-item">
                        <label>Max Login Attempts</label>
                        <input type="number" class="form-control" value="5">
                    </div>
                </div>
                
                <button class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
