{% extends 'base.html' %}

{% block content %}

<div class="dashboard">
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('admin.dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('admin.code_spirit_monitoring') }}">Skill Up</a></li>
            <li><a href="{{ url_for('admin.manage_users') }}">Manage Users</a></li>
            <li><a href="{{ url_for('admin.manage_jobs') }}" class="active">Manage Jobs</a></li>
            <li><a href="{{ url_for('admin.manage_tickets') }}">Support Tickets</a></li>
            <li><a href="{{ url_for('admin.analytics') }}">Analytics</a></li>
        </ul>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <h1 style="color: white !important;">Add New Job</h1>
            <p style="color: var(--gray);">Create a new job posting</p>
        </div>
        
        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Software Engineer" required>
                </div>
                
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" name="company" class="form-control" placeholder="e.g. Tech Corp" required>
                </div>
                
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location" class="form-control" placeholder="Remote or city">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Job description and responsibilities" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Requirements</label>
                    <textarea name="requirements" class="form-control" rows="3" placeholder="Skills and qualifications required" required></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Minimum Salary</label>
                        <input type="number" name="salary_min" class="form-control" placeholder="500000" required>
                    </div>
                    <div class="form-group">
                        <label>Maximum Salary</label>
                        <input type="number" name="salary_max" class="form-control" placeholder="1500000" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="is_active" checked>
                        <span>Active Job</span>
                    </label>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Add Job</button>
                    <a href="{{ url_for('admin.manage_jobs') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
