{% extends 'base.html' %}

{% block content %}

<div class="dashboard">
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('admin.dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('admin.code_spirit_monitoring') }}">Skill Up</a></li>
            <li><a href="{{ url_for('admin.manage_users') }}">Manage Users</a></li>
            <li><a href="{{ url_for('admin.manage_jobs') }}" class="active">Manage Jobs</a></li>
            <li><a href="{{ url_for('admin.manage_tickets') }}">Support Tickets</a></li>
            <li><a href="{{ url_for('admin.analytics') }}">Analytics</a></li>
        </ul>
    </aside>
    
    <main class="main-content">
<!--        <div class="page-header">-->
<!--            <h1 style="color: white !important;">Edit Job</h1>-->
<!--            <p style="color: var(&#45;&#45;gray);">Update job information</p>-->
<!--        </div>-->
        
        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" name="title" class="form-control" value="{{ job.title }}" required>
                </div>
                
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" name="company" class="form-control" value="{{ job.company }}" required>
                </div>
                
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location" class="form-control" value="{{ job.location }}" placeholder="Remote or city">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="4" required>{{ job.description }}</textarea>
                </div>
                
                <div class="form-group">
                    <label>Requirements</label>
                    <textarea name="requirements" class="form-control" rows="3" required>{{ job.requirements }}</textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Minimum Salary</label>
                        <input type="number" name="salary_min" class="form-control" value="{{ job.salary_min }}" required>
                    </div>
                    <div class="form-group">
                        <label>Maximum Salary</label>
                        <input type="number" name="salary_max" class="form-control" value="{{ job.salary_max }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="is_active" {{ 'checked' if job.is_active else '' }}>
                        <span>Active Job</span>
                    </label>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Update Job</button>
                    <a href="{{ url_for('admin.manage_jobs') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
